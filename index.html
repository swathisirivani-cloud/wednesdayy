<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spice Corner | Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>🍛 Spice Corner</h1>
    <p>Fresh, homely food made with love</p>
    <p class="info">📍 Main Road, Chennai &nbsp;|&nbsp; 🕘 Open 8 AM to 10 PM</p>
  </header>

  <main class="container">
    <input id="search" type="text" placeholder="🔍 Search for a dish...">

    <div class="filters">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="breakfast">Breakfast</button>
      <button class="filter-btn" data-category="main">Main Course</button>
      <button class="filter-btn" data-category="snacks">Snacks</button>
      <button class="filter-btn" data-category="desserts">Desserts</button>
      <button class="filter-btn" data-category="drinks">Drinks</button>
    </div>

    <div id="menuGrid" class="menu-grid"></div>
    <p id="noResults" class="no-results" hidden>No dishes found. Try another search!</p>
  </main>

  <div class="order-bar">
    <span>🛒 <strong id="orderCount">0</strong> items</span>
    <span>Total: <strong>₹<span id="orderTotal">0</span></strong></span>
    <button id="clearOrder">Clear</button>
  </div>

  <footer>
    <p>© 2026 Spice Corner. All prices include taxes.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
